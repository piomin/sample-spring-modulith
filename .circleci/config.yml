version: 2.1

jobs:
  build:
    docker:
      - image: 'cimg/openjdk:25.0.5'
    steps:
      - checkout
      - run:
          name: Analyze on SonarCloud
          command: mvn verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

executors:
  jdk:
    docker:
      - image: 'cimg/openjdk:25.0.5'

orbs:
  maven: circleci/maven@2.4.0

workflows:
  maven_test:
    jobs:
      - maven/test:
          executor: jdk
      - build:
          context: SonarCloud
